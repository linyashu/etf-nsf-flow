# 复制为 cordis.patch.yml 并填入自己的凭据。
# cordis.patch.yml 已被 .gitignore 排除，不会进入仓库。
- insert:
    - id: etf-nsf-flow
      name: dsh-etf-nsf-flow
      config:
        token: ""            # tushare token，或用环境变量 TUSHARE_TOKEN
        lookbackDays: 120
        cacheMinutes: 30
        routePath: /etf-flow/data.json
        windKey: ""          # 可选，或用环境变量 WIND_API_KEY
        holderCacheHours: 24
        storage: db          # db = 读本地库；live = 直连数据源兜底
        db:
          host: 127.0.0.1
          port: 5432
          user: postgres
          password: ""
          database: timescaledb
